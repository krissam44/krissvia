<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Avant-plan de l'icône Krissvia (reprise de DomoMud) : une maison (domotique) abritant une flamme
     (le chauffage, cœur de l'application), dans l'ambre #FFB300 déjà utilisé
     partout dans l'application pour l'énergie.

     ZONE DE SÉCURITÉ : sur Android l'icône adaptative est rognée en cercle, seul
     le disque central (~66 % du canevas, soit un rayon de ~152 sur 456) est
     garanti visible. Tout le tracé — épaisseur de trait comprise — tient donc
     dans un rayon de ~141 autour du centre (228,228), coins bas inclus. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">

    <!-- Toit + murs. Trait épais pour rester lisible à 48 px. -->
    <path d="M228 140 L140 216 V302 a14 14 0 0 0 14 14 h148 a14 14 0 0 0 14 -14 V216 Z"
          fill="none" stroke="#FFFFFF" stroke-width="22"
          stroke-linejoin="round" stroke-linecap="round" />

    <!-- Flamme : le chauffage piloté -->
    <path d="M228 230
             c 18 22 28 35 28 48
             a 28 28 0 0 1 -56 0
             c 0 -13 10 -26 28 -48 Z"
          fill="#FFB300" />

    <!-- Cœur clair de la flamme, pour la profondeur -->
    <path d="M228 266
             c 8 10 13 16 13 22
             a 13 13 0 0 1 -26 0
             c 0 -6 5 -12 13 -22 Z"
          fill="#FFE082" />
</svg>
