    <path d="M228 140 L140 216 V302 a14 14 0 0 0 14 14 h148 a14 14 0 0 0 14 -14 V216 Z"
          fill="none" stroke="#FFFFFF" stroke-width="22"
          stroke-linejoin="round" stroke-linecap="round" />

    <path d="M228 230
             c 18 22 28 35 28 48
             a 28 28 0 0 1 -56 0
             c 0 -13 10 -26 28 -48 Z"
          fill="#FFB300" />

    <path d="M228 266
             c 8 10 13 16 13 22
             a 13 13 0 0 1 -26 0
             c 0 -6 5 -12 13 -22 Z"
          fill="#FFE082" />
</svg>
